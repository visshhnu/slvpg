<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>SLVPG — Co-Living PG</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0F2A4A;--gold:#C99A3E;--cream:#FAF6EE;--green:#2F7A4F;
  --red:#B23B3B;--ink:#262321;--ink-soft:#6B6560;--border:#E2DDD5;
  --card:#FFFFFF;--radius:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
.hero{background:var(--navy);color:#fff;padding:32px 20px 28px;text-align:center}
.hero-logo{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hero-logo img{width:100%;height:100%;object-fit:cover}
h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.hero-tagline{font-size:14px;color:#C99A3E;margin-top:6px}
.hero-address{font-size:12px;color:rgba(255,255,255,.65);margin-top:8px;display:flex;align-items:center;justify-content:center;gap:4px}
.photos-strip{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 0;scrollbar-width:none}
.photos-strip::-webkit-scrollbar{display:none}
.photo-thumb{flex-shrink:0;width:220px;height:150px;border-radius:10px;object-fit:cover;border:1px solid var(--border)}
.photo-placeholder{flex-shrink:0;width:220px;height:150px;border-radius:10px;background:var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:12px}
.section{padding:20px 16px 0}
.section-title{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-soft);text-transform:uppercase;margin-bottom:12px}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:12px}
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border)}
.price-cell{background:var(--card);padding:16px 14px}
.price-cell.triple{grid-column:1/-1}
.price-type{font-size:11px;color:var(--ink-soft);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.price-amount{font-size:26px;font-weight:700;color:var(--navy);margin-top:4px;letter-spacing:-.5px}
.price-sub{font-size:11px;color:var(--ink-soft);margin-top:3px}
.avail-badge{display:inline-block;font-size:10px;padding:3px 8px;border-radius:99px;margin-top:8px;font-weight:600}
.avail-yes{background:#E5F5EC;color:#1B6B3A}
.avail-no{background:#FDECEA;color:#922B21}
.amenity-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:12px}
.amenity-item{padding:11px 14px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:13px}
.amenity-item:nth-child(2n){border-right:none}
.amenity-item:nth-last-child(-n+2){border-bottom:none}
.amenity-icon{width:20px;height:20px;flex-shrink:0;color:var(--gold)}
.rules-list{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:12px}
.rule-row{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.5}
.rule-row:last-child{border-bottom:none}
.rule-num{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.desc-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:16px;font-size:14px;line-height:1.7;color:var(--ink);margin-bottom:12px}
.cta-bar{position:sticky;bottom:0;background:var(--navy);padding:16px;display:flex;gap:10px;border-top:1px solid rgba(255,255,255,.1)}
.btn-call{flex:1;background:var(--gold);color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-enquire{flex:1;background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4);border-radius:10px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.enquire-sheet{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:flex-end}
.enquire-sheet.open{display:flex}
.sheet-inner{background:var(--cream);border-radius:20px 20px 0 0;padding:24px 20px 40px;width:100%;max-height:90vh;overflow-y:auto}
.sheet-title{font-size:18px;font-weight:700;margin-bottom:16px}
label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;margin-top:14px}
input,select,textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:11px 13px;font-size:14px;background:#fff;color:var(--ink);outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--navy)}
textarea{resize:none;height:80px}
.btn-submit{width:100%;background:var(--navy);color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;margin-top:20px;cursor:pointer}
.success-msg{background:#E5F5EC;border-radius:10px;padding:20px;text-align:center;color:#1B6B3A;font-size:14px;font-weight:600;margin-top:12px;display:none}
.loading{text-align:center;padding:60px 20px;color:var(--ink-soft)}
.error-page{text-align:center;padding:60px 20px}
.error-page h2{font-size:20px;margin-bottom:8px}
.footer{padding:24px 16px;text-align:center;font-size:11px;color:var(--ink-soft);padding-bottom:100px}
</style>
</head>
<body>

<div id="app"><div class="loading">Loading property details…</div></div>

<div class="enquire-sheet" id="enquire-sheet">
  <div class="sheet-inner">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div class="sheet-title">Enquire about a room</div>
      <button onclick="closeEnquire()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink-soft);">✕</button>
    </div>
    <label>Your name</label>
    <input id="enq-name" placeholder="Full name" type="text">
    <label>Phone number</label>
    <input id="enq-phone" placeholder="10-digit mobile number" type="tel">
    <label>Room type preferred</label>
    <select id="enq-type">
      <option value="">Select room type</option>
      <option value="single">Single sharing</option>
      <option value="double">Double sharing</option>
      <option value="triple">Triple sharing</option>
      <option value="any">Any available</option>
    </select>
    <label>Moving in around</label>
    <input id="enq-date" type="date">
    <label>Message (optional)</label>
    <textarea id="enq-msg" placeholder="Any questions about the property, rules, pricing…"></textarea>
    <button class="btn-submit" onclick="submitEnquiry()">Send enquiry</button>
    <div class="success-msg" id="enq-success">
      Enquiry sent! We'll contact you within 24 hours on your number.
    </div>
    <p style="font-size:11px;color:var(--ink-soft);margin-top:12px;text-align:center;">No payment required to enquire. We'll call you to discuss.</p>
  </div>
</div>

<script>
const pgId = new URLSearchParams(location.search).get('pg') || '1';

const AMENITY_ICONS = {
  'Wi-Fi': '<path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="1"/>',
  'CCTV': '<path d="m2 8 2 2-2 2 2 2-2 2"/><path d="M8.5 8h.5a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H8"/><rect x="14" y="8" width="8" height="8" rx="2"/>',
  'Power backup': '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
  'RO water': '<path d="M12 2v6"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M5 10H3"/><path d="M21 10h-2"/>',
  'Geyser': '<path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7z"/>',
  'Lift': '<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M10 8 8 6l-2 2"/><path d="M10 16l-2 2-2-2"/>',
  'Washing machine': '<path d="M3 6h18"/><rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="12" cy="14" r="4"/>',
  'CCTV Security': '<path d="m2 8 2 2-2 2 2 2-2 2"/><path d="M8.5 8h.5a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2H8"/><rect x="14" y="8" width="8" height="8" rx="2"/>',
  '24/7 Security': '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>',
  'Parking': '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/>',
  'Dining area': '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/>',
  'Working space': '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>',
  'Housekeeping': '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
};
const DEFAULT_ICON = '<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>';

function iconSvg(name) {
  const d = AMENITY_ICONS[name] || DEFAULT_ICON;
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;">${d}</svg>`;
}

function fmt(n) { return '₹' + Number(n).toLocaleString('en-IN'); }

async function load() {
  try {
    const id = pgId || '1';
    const r = await fetch(`/api/property/${id}`);
    const data = await r.json();
    if (!r.ok) { showError(data.error || 'Page not available'); return; }
    render(data);
  } catch(e) { showError('Could not load property details.'); }
}

function showError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="error-page">
      <div style="font-size:48px;margin-bottom:12px;">🏠</div>
      <h2>Page not available</h2>
      <p style="color:var(--ink-soft);font-size:14px;margin-top:6px;">${msg}</p>
    </div>`;
}

function render(d) {
  const avMap = {};
  (d.availability || []).forEach(a => { avMap[a.sharing_type] = a; });

  const pricingCards = ['single','double','triple'].map(t => {
    const p = d.pricing[t];
    if (!p) return '';
    const a = avMap[t];
    const avail = a ? a.available_beds : 0;
    const badge = avail > 0
      ? `<span class="avail-badge avail-yes">${avail} bed${avail>1?'s':''} available</span>`
      : `<span class="avail-badge avail-no">Full — waitlist</span>`;
    return `
      <div class="price-cell ${t==='triple'?'triple':''}">
        <div class="price-type">${t} sharing</div>
        <div class="price-amount">${fmt(p.rent)}<span style="font-size:14px;font-weight:400;color:var(--ink-soft)">/mo</span></div>
        <div class="price-sub">Advance: ${fmt(p.advance || 0)}</div>
        ${badge}
      </div>`;
  }).join('');

  const photos = d.photos && d.photos.length > 0
    ? d.photos.map(url => `<img class="photo-thumb" src="${url}" alt="Property photo" loading="lazy">`).join('')
    : `<div class="photo-placeholder">No photos yet</div>`;

  const amenities = d.amenities && d.amenities.length > 0
    ? `<div class="section"><div class="section-title">Amenities</div><div class="amenity-grid">
        ${d.amenities.map(a => `<div class="amenity-item"><span class="amenity-icon">${iconSvg(a)}</span>${a}</div>`).join('')}
       </div></div>` : '';

  const rules = d.house_rules && d.house_rules.length > 0
    ? `<div class="section"><div class="section-title">House rules</div><div class="rules-list">
        ${d.house_rules.map((r,i) => `<div class="rule-row"><div class="rule-num">${i+1}</div><div>${r}</div></div>`).join('')}
       </div></div>` : '';

  document.getElementById('app').innerHTML = `
    <div class="hero" style="position:relative;">
      <a href="/manage.html" title="Staff login" style="position:absolute;top:10px;right:12px;opacity:0.35;color:#fff;text-decoration:none;display:flex;align-items:center;gap:4px;font-size:11px;" onmouseover="this.style.opacity='.8'" onmouseout="this.style.opacity='.35'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </a>
      <div class="hero-logo">
        <img src="/logo.png" alt="SLV Luxury PG logo">
      </div>
      <h1>${d.name}</h1>
      ${d.tagline ? `<div class="hero-tagline">${d.tagline}</div>` : ''}
      ${d.address ? `<div class="hero-address"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${d.address}</div>` : ''}
    </div>
    </div>

    <div class="photos-strip">${photos}</div>

    ${d.description ? `<div class="section"><div class="section-title">About this PG</div><div class="desc-card">${d.description}</div></div>` : ''}

    <div class="section">
      <div class="section-title">Pricing &amp; availability</div>
      <div class="card"><div class="price-grid">${pricingCards}</div></div>
    </div>

    ${amenities}
    ${rules}

    <div class="footer">Managed by ${d.name} · Contact ${d.contact_phone || 'management'}</div>

    <div class="cta-bar">
      <a href="tel:${d.contact_phone || ''}" class="btn-call">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.64 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.06 6.06l.98-.98a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Call now
      </a>
      <button class="btn-enquire" onclick="openEnquire()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Enquire
      </button>
    </div>
  `;
  document.title = d.name + ' — Co-Living PG';
  window._pgPhone = d.contact_phone;
  window._pgName = d.name;
}

function openEnquire() { document.getElementById('enquire-sheet').classList.add('open'); }
function closeEnquire() { document.getElementById('enquire-sheet').classList.remove('open'); }

function submitEnquiry() {
  const name = document.getElementById('enq-name').value.trim();
  const phone = document.getElementById('enq-phone').value.trim();
  const type = document.getElementById('enq-type').value;
  const date = document.getElementById('enq-date').value;
  const msg = document.getElementById('enq-msg').value.trim();

  if (!name || !phone) { alert('Please enter your name and phone number.'); return; }

  // Build a WhatsApp message to the PG's management number
  const lines = [
    `*Room Enquiry — ${window._pgName}*`,
    `Name: ${name}`,
    `Phone: ${phone}`,
    type ? `Room type: ${type} sharing` : '',
    date ? `Moving in: ${date}` : '',
    msg ? `Message: ${msg}` : '',
  ].filter(Boolean).join('\n');

  const waNumber = (window._pgPhone || '').replace(/\D/g, '');
  if (waNumber) {
    window.open(`https://wa.me/91${waNumber}?text=${encodeURIComponent(lines)}`, '_blank');
  }
  document.getElementById('enq-success').style.display = 'block';
  setTimeout(closeEnquire, 3000);
}

load();
</script>
</body>
</html>
